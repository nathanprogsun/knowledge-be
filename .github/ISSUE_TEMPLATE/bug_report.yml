name: Bug report
description: Something is broken
title: "[bug] "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Observed behaviour, including the exact error text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Steps, request/response pairs, or a minimal test case.
      placeholder: |
        1. ...
        2. ...
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Backend/frontend commit, DB, OS.
