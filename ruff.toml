line-length = 100
target-version = "py311"
src = ["src", "tests"]
# `scripts/` holds standalone anti-drift tooling; it is not
# application code and is not linted. `*_pb2*` files are
# protoc-generated — never hand-edited, so lint/format skip them.
extend-exclude = ["scripts", "src/ai/docreader/proto"]

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "PIE", # flake8-pie
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # line-too-long (handled by formatter)
    "ISC001", # single-line implicit string concat (conflicts with formatter)
    # The project bans `if TYPE_CHECKING:` blocks, so ignore all TC rules.
    "TC001",
    "TC002",
    "TC003",
    "TC004",
    "TC005",
    "TC006",  # quoted type expressions - keep readable
    # CJK user-facing strings legitimately contain fullwidth
    # punctuation; the ambiguous-char rules exist to catch lookalikes
    # in identifiers, which this codebase does not use.
    "RUF001",
    "RUF002",
    "RUF003",
]

[lint.isort]
known-first-party = ["src", "tests"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"