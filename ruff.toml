line-length = 100
target-version = "py311"
src = ["src", "tests"]

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "PIE", # flake8-pie
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # line-too-long (handled by formatter)
    "ISC001", # single-line implicit string concat (conflicts with formatter)
    # TC rules suggest moving imports into `if TYPE_CHECKING:` blocks.
    # AGENTS.md §6.2 bans TYPE_CHECKING entirely. Ignore all TC rules.
    "TC001",
    "TC002",
    "TC003",
    "TC004",
    "TC005",
    "TC006",  # quoted type expressions - keep readable
]

[lint.isort]
known-first-party = ["src"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"