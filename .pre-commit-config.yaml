repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-ast
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.7
          - pydantic-settings>=2.0
          - sqlalchemy>=2.0
          - types-passlib
          - types-python-jose
          - types-redis
        args: [--config=mypy.ini]
        pass_filenames: false
        # Typecheck is heavy (full src+tests under strict mode); keep it
        # out of the commit-time checkpoint so pre-commit stays fast.
        # Run on pre-push instead. Install via:
        #   pre-commit install --hook-type pre-commit --hook-type pre-push
        stages: [pre-push]

  - repo: local
    hooks:
      - id: verify-agent-notes
        name: verify-agent-notes
        entry: python scripts/verify_agent_notes.py --repo-root .
        language: system
        pass_filenames: false