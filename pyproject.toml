[project]
name = "knowledge-be"
version = "0.1.0"
description = "Backend service for knowledge management and AI-powered Q&A"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "knowledge-be maintainers" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "gunicorn>=22.0",
    # Required by FastAPI to parse multipart/form-data bodies (the
    # initialization multimodal probe uploads an image file).
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "redis>=5.0",
    "arq>=0.26",
    "httpx>=0.27",
    "orjson>=3.9",
    "loguru>=0.7",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "grpcio>=1.66",
    "grpcio-tools>=1.66",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "testcontainers[postgresql]>=4.0",
    # Async SQLite driver: service tests bind an in-memory SQLAlchemy engine
    # instead of spinning up a container.
    "aiosqlite>=0.20",
    "anyio>=4.0",
    "pre-commit>=3.5",
    "types-passlib>=1.7",
    "types-python-jose>=3.3",
    "types-redis>=4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-markers", "--strict-config"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]