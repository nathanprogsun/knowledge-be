[project]
name = "knowledge-be"
version = "0.1.0"
description = "Backend service for knowledge management and AI-powered Q&A"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "knowledge-be maintainers" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "gunicorn>=22.0",
    # Required by FastAPI to parse multipart/form-data bodies (the
    # initialization multimodal probe uploads an image file).
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "redis>=5.0",
    "arq>=0.26",
    "httpx>=0.27",
    # SSE transport for MCP-over-SSE (httpx-sse).
    "httpx-sse>=0.4",
    "orjson>=3.9",
    "loguru>=0.7",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "grpcio>=1.66",
    "grpcio-tools>=1.66",
    "neo4j>=6.2.0",
    "tencentcloud-sdk-python-lkeap>=3.1.145",
    "qdrant-client>=1.19.0",
    "pymilvus>=3.0.1",
    "weaviate-client>=4.22.0",
    "elasticsearch>=9.5.0",
    "elasticsearch7>=7.17.13",
    "opensearch-py>=3.2.0",
    "sqlite-vec>=0.1.9",
    "pymysql>=1.2.0",
    "tcvectordb>=2.1.1",
    "pgvector>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    # Async SQLite driver: service tests bind an in-memory SQLAlchemy engine
    # instead of spinning up a container.
    "aiosqlite>=0.20",
    "anyio>=4.0",
    # respx mocks the httpx transport so the SSE tests run without a live MCP server.
    "respx>=0.21",
    "pre-commit>=3.5",
    "types-passlib>=1.7",
    "types-python-jose>=3.3",
    "types-redis>=4.6",
    # Test scaffolding: polyfactory generates Pydantic row models for tests,
    # faker backs the underlying faker provider for non-trivial types.
    "polyfactory>=2.15",
    "faker>=24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--strict-markers",
    "--strict-config",
    # asyncpg connections are torn down at GC when the sync-def session
    # engine is collected; pytest's unraisable plugin would turn those
    # benign ResourceWarnings into session failures under filterwarnings=error.
    # A later TestClient migration closes the engine properly; until then
    # the plugin is disabled so real warnings still error but __del__ noise
    # does not.
    "-p", "no:unraisableexception",
]
filterwarnings = [
    "error",
    # Starlette warns that httpx is deprecated for TestClient on import.
    # The test suite uses TestClient (sync portal loop) deliberately, so
    # the import-time deprecation notice is suppressed.
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
