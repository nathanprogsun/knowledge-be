[mypy]
python_version = 3.11
strict = True
disallow_any_generics = True
warn_return_any = True
warn_unused_configs = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
check_untyped_defs = True
show_error_codes = True
files = src, tests

[mypy-tests.*]
disallow_untyped_decorators = False

# PR-17.5a: third-party libs that ship without type stubs.
[mypy-respx]
ignore_missing_imports = True
[mypy-httpx_sse]
ignore_missing_imports = True

# `disallow_any_explicit` is intentionally OFF: every BaseModel subclass
# inherits Any-typed signatures from Pydantic's metaclass, and pydantic
# 2.13.x ships a non-functional mypy plugin (the missing
# `mypy.expandtype.ExpandTypeVisitor` symbol makes it unloadable on every
# mypy version currently on PyPI). Re-enable once Pydantic ships a working
# plugin for our pinned mypy.
disallow_any_explicit = False