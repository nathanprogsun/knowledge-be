apiVersion: apps/v1
kind: Deployment
metadata:
  name: kb-worker
  labels:
    app.kubernetes.io/name: knowledge-be
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: knowledge-be
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: knowledge-be
        app.kubernetes.io/component: worker
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: ghcr.io/example/knowledge-be-worker:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "src.workers.main"]
          envFrom:
            - configMapRef:
                name: kb-worker-config
            - secretRef:
                name: kb-worker-secret
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          livenessProbe:
            exec:
              command:
                - pgrep
                - "-f"
                - "python -m src.workers.main"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3