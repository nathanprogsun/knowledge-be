apiVersion: v1
kind: ConfigMap
metadata:
  name: kb-worker-config
  labels:
    app.kubernetes.io/name: knowledge-be
    app.kubernetes.io/component: worker
data:
  # Queue + job execution
  WORKER_QUEUE_NAME: "arq:queue"
  WORKER_MAX_JOBS: "10"
  WORKER_JOB_TIMEOUT: "300"
  WORKER_MAX_TRIES: "5"
  WORKER_POLL_DELAY: "0.5"
  WORKER_KEEP_RESULT: "3600"

  # Pool tuning
  WORKER_MAX_CONNECTIONS: "10"
  WORKER_CONN_TIMEOUT: "1"
  WORKER_CONN_RETRIES: "5"
  WORKER_CONN_RETRY_DELAY: "1"

  # Health + process
  WORKER_HEALTH_CHECK_INTERVAL: "3600"
  WORKER_BURST: "false"
  WORKER_HANDLE_SIGNALS: "true"
  WORKER_LOG_RESULTS: "true"