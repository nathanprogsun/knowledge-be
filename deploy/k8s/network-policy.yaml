# NetworkPolicy — deny all ingress by default, allow only explicit flows.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kb-deny-all
  labels:
    app.kubernetes.io/name: knowledge-be
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kb-api-allow-ingress
  labels:
    app.kubernetes.io/name: knowledge-be
    app.kubernetes.io/component: api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: knowledge-be
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  ingress:
    # Allow from ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8000
          protocol: TCP
    # Allow from within the same namespace
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: knowledge-be
      ports:
        - port: 8000
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kb-allow-egress
  labels:
    app.kubernetes.io/name: knowledge-be
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: knowledge-be
  policyTypes:
    - Egress
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
    # PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - port: 5432
          protocol: TCP
    # Redis
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - port: 6379
          protocol: TCP
    # Document reader (gRPC)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: docreader
      ports:
        - port: 50051
          protocol: TCP
    # External outbound (OIDC discovery, web search, etc.)
    - to:
        - namespaceSelector: {}
      ports:
        - port: 443
          protocol: TCP
        - port: 80
          protocol: TCP